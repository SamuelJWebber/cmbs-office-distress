name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[test]"

      - name: Run pytest suite (strictly offline)
        run: pytest -v

      - name: Verify committed docs/index.html matches fixture render
        run: python -m cmbs_distress build --check

      - name: Validate CMBS_CONTACT secret format (if configured)
        env:
          CMBS_CONTACT: ${{ secrets.CMBS_CONTACT }}
        run: |
          if [ -n "$CMBS_CONTACT" ]; then
            python -m cmbs_distress check-contact
          else
            echo "CMBS_CONTACT not configured; running in fixture-proven prototype mode."
          fi
