[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmbs-office-distress"
version = "0.2.0"
description = "Label-based SEC Form ABS-EE (CMBS) loan-tape parser, longitudinal distress analytics, and static GitHub Pages dashboard."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []  # pure standard library at runtime

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cmbs-distress = "cmbs_distress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
